services:
  api:
    build: .
    container_name: evolve_matchmaker_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: evolve_matchmaker_db
    environment:
      POSTGRES_DB: evolve_matchmaker
      POSTGRES_USER: evolve_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: